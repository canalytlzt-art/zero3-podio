name = "zero3-podio"
main = "artifacts/api-server/src/worker.ts"
compatibility_date = "2026-10-30"
compatibility_flags = [
  "nodejs_compat",
  "nodejs_compat_populate_process_env",
]
keep_vars = true

[vars]
ZERO3_CLOUDFLARE_WORKER = "true"
NODE_ENV = "production"

[assets]
directory = "./artifacts/zero3-pro/dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[hyperdrive]]
binding = "HYPERDRIVE"
# Cache-disabled Hyperdrive configuration for the separate Neon test database.
id = "794b0f4bf3534892be7b89be1613c7bc"
