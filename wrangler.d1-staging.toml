# Isolated D1 test Worker configuration. This is not the production config.
# Replace database_id only after creating/confirming the dedicated remote D1.
# The zero ID is a local-only placeholder and must never be deployed.
name = "zero3-games-d1-staging"
main = "artifacts/api-server/src/worker.ts"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[vars]
ZERO3_CLOUDFLARE_WORKER = "true"
NODE_ENV = "production"

[assets]
directory = "./artifacts/zero3-pro/dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "zero3-games-d1-staging"
database_id = "00000000000000000000000000000000"
migrations_dir = "lib/db/d1-migrations"
