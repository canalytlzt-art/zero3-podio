# Isolated D1 test Worker configuration. This is not the production config.
# This configuration targets only the user-identified Development D1.
# Do not copy this binding into the production wrangler.toml.
name = "zero3-games-d1-staging"
main = "artifacts/api-server/src/worker-d1-staging.ts"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
keep_vars = true

[vars]
ZERO3_CLOUDFLARE_WORKER = "true"
NODE_ENV = "production"

[assets]
directory = "./artifacts/zero3-pro/dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "zero3-podio-dev"
database_id = "60416dac-0da6-48d9-a2d2-c267760f4b7a"
migrations_dir = "lib/db/d1-migrations"
