openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: zero3
    description: ZERO3 competition operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /zero3/me:
    get:
      operationId: getZero3Me
      tags: [zero3]
      summary: Get current app role
      responses:
        "200":
          description: Authenticated user role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3Me"
        "401":
          description: Authentication required
  /zero3/dashboard:
    get:
      operationId: getZero3Dashboard
      tags: [zero3]
      summary: Get operation summary
      responses:
        "200":
          description: Summary for the current operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3Dashboard"
        "401":
          description: Authentication required
  /zero3/events:
    get:
      operationId: listZero3Events
      tags: [zero3]
      summary: List competition events
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zero3Event"
        "401":
          description: Authentication required
    post:
      operationId: createZero3Event
      tags: [zero3]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zero3EventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3Event"
        "401":
          description: Authentication required
  /zero3/events/restore:
    post:
      operationId: restoreZero3EventBackup
      tags: [zero3]
      summary: Restore an event from its exported backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zero3EventRestoreInput"
      responses:
        "201":
          description: Event restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3EventRestoreResult"
        "400":
          description: Invalid backup
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
        "409":
          description: Event or global athlete data conflicts with the backup
  /zero3/events/{eventId}/deletion-backup:
    get:
      operationId: getZero3EventDeletionBackup
      tags: [zero3]
      summary: Export a complete recoverable event backup
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Complete event backup; global athlete records are references and are not deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3EventBackup"
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
        "404":
          description: Event not found
  /zero3/events/{eventId}:
    get:
      operationId: getZero3Event
      tags: [zero3]
      summary: Read an event for an authorized operator
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3Event"
        "401":
          description: Authentication required
        "403":
          description: Event operator role required
        "404":
          description: Event not found
    patch:
      operationId: updateZero3Event
      tags: [zero3]
      summary: Update an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zero3EventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3Event"
        "401":
          description: Authentication required
        "404":
          description: Event not found
    delete:
      operationId: deleteZero3Event
      tags: [zero3]
      summary: Permanently delete an event after explicit confirmation
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zero3EventDeleteInput"
      responses:
        "200":
          description: Event and event-owned records deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3EventDeleteResult"
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
        "404":
          description: Event not found
        "409":
          description: Event changed or confirmation does not match
  /zero3/events/{eventId}/proofs:
    get:
      operationId: listZero3Proofs
      tags: [zero3]
      summary: List the four configurable proofs for an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Proof definitions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Zero3Proof" }
        "401":
          description: Authentication required
  /zero3/events/{eventId}/proofs/{proofId}:
    patch:
      operationId: updateZero3Proof
      tags: [zero3]
      summary: Configure one proof's name and scoring metric
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: path
          name: proofId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zero3ProofUpdate" }
      responses:
        "200":
          description: Updated proof
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3Proof" }
        "400":
          description: Invalid proof configuration
        "401":
          description: Authentication required
        "404":
          description: Proof not found
        "409":
          description: Metric cannot change after results have been recorded
  /zero3/events/{eventId}/heats:
    get:
      operationId: listZero3Heats
      tags: [zero3]
      summary: List event heats
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event heats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zero3Heat"
        "401":
          description: Authentication required
    post:
      operationId: createZero3Heat
      tags: [zero3]
      summary: Create an event heat
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zero3HeatInput"
      responses:
        "201":
          description: Created heat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3Heat"
        "401":
          description: Authentication required
        "409":
          description: Heat order already exists
  /zero3/events/{eventId}/batteries:
    get:
      operationId: listZero3EventBatteries
      tags: [zero3]
      summary: List event-scoped batteries with all four proof results
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Event batteries and proof results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Zero3EventBattery" }
        "401":
          description: Authentication required
    post:
      operationId: createZero3EventBattery
      tags: [zero3]
      summary: Create one event battery and assign registrations
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zero3EventBatteryInput" }
      responses:
        "201":
          description: Created event battery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3EventBattery" }
        "400":
          description: Invalid registration assignment
        "401":
          description: Authentication required
        "409":
          description: Battery order or registration assignment conflicts
  /zero3/events/{eventId}/batteries/{batteryId}:
    patch:
      operationId: updateZero3EventBattery
      tags: [zero3]
      summary: Edit event battery metadata and eligible composition
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: path
          name: batteryId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zero3EventBatteryUpdateInput" }
      responses:
        "200":
          description: Updated event battery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3EventBattery" }
        "400":
          description: Invalid assignment
        "401":
          description: Authentication required
        "403":
          description: ADMIN or JUIZ_CHEFE role required
        "404":
          description: Battery not found
        "409":
          description: Battery is no longer eligible or changed concurrently
    delete:
      operationId: deleteZero3EventBattery
      tags: [zero3]
      summary: Delete an event battery and its owned results after confirmation
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: path
          name: batteryId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zero3EventBatteryDeleteInput" }
      responses:
        "200":
          description: Battery and its operational data deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3EventBatteryDeleteResult" }
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
        "404":
          description: Battery not found
        "409":
          description: Battery changed or is currently running
  /zero3/events/{eventId}/batteries/{batteryId}/time-cap:
    patch:
      operationId: updateZero3EventBatteryTimeCap
      tags: [zero3]
      summary: Update an event battery time cap with concurrency checks and an audit record
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: path
          name: batteryId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zero3BatteryTimeCapUpdateInput" }
      responses:
        "200":
          description: Updated event battery and timer cap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3EventBattery" }
        "400":
          description: Invalid cap
        "401":
          description: Authentication required
        "403":
          description: ADMIN or JUIZ_CHEFE role required before first start; ADMIN required afterward
        "404":
          description: Battery not found
        "409":
          description: Timer changed, battery is not paused after start, or cap conflicts with elapsed time
  /zero3/events/{eventId}/active-event-battery:
    patch:
      operationId: setZero3ActiveEventBattery
      tags: [zero3]
      summary: Select the event battery shown on the TV without changing its timer
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zero3ActiveEventBatteryInput" }
      responses:
        "200":
          description: Active event battery
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Zero3EventBattery" }
                  - { type: "null" }
        "400":
          description: Battery does not belong to the event
        "401":
          description: Authentication required
  /zero3/events/{eventId}/batteries/{batteryId}/finalize:
    post:
      operationId: finalizeZero3EventBattery
      tags: [zero3]
      summary: Operationally finalize one event battery without publishing results
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: path
          name: batteryId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zero3FinalizeEventBatteryInput" }
      responses:
        "200":
          description: Operationally finalized event battery; official ranking publication is separate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3FinalizeEventBatteryResponse" }
        "401":
          description: Authentication required
        "403":
          description: ADMIN or JUIZ_CHEFE role required
        "404":
          description: Event battery not found
        "409":
          description: One or more proof results are incomplete or unreviewed
  /zero3/events/{eventId}/active-heats/{category}:
    put:
      operationId: setZero3ActiveHeat
      tags: [zero3]
      summary: Select the heat shown for one category on the public TV
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: path
          name: category
          required: true
          schema: { $ref: "#/components/schemas/Zero3Category" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zero3ActiveHeatInput"
      responses:
        "200":
          description: Active heat selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3ActiveHeat"
        "400":
          description: Heat does not belong to this event and category
        "401":
          description: Authentication required
  /zero3/events/{eventId}/active-battery:
    put:
      operationId: setZero3ActiveBattery
      tags: [zero3]
      summary: Select one proof-and-number battery for the public TV
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zero3ActiveBatteryInput" }
      responses:
        "200":
          description: Active battery selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3ActiveBatteryResponse" }
        "400":
          description: Heat does not belong to the event or has no proof
        "401":
          description: Authentication required
        "409":
          description: The current battery timer is still active
  /zero3/events/{eventId}/batteries/{proofId}/{batteryOrder}/finalize:
    post:
      operationId: finalizeZero3Battery
      tags: [zero3]
      summary: Review and atomically publish a complete proof battery
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: path
          name: proofId
          required: true
          schema: { type: string }
        - in: path
          name: batteryOrder
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zero3FinalizeBatteryInput" }
      responses:
        "200":
          description: Existing or newly published battery finalization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3FinalizeBatteryResponse" }
        "401":
          description: Authentication required
        "403":
          description: ADMIN or JUIZ_CHEFE role required
        "404":
          description: Battery not found
        "409":
          description: Results are incomplete, stale, or have unresolved ties
  /zero3/events/{eventId}/heats/{heatId}/proof:
    put:
      operationId: updateZero3HeatProof
      tags: [zero3]
      summary: Link a legacy heat to a proof without changing its ID
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: path
          name: heatId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zero3HeatProofInput" }
      responses:
        "200":
          description: Linked heat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3Heat" }
        "400":
          description: Invalid heat or proof for the event
        "401":
          description: Authentication required
        "409":
          description: The heat has results or the logical order is occupied
  /zero3/events/{eventId}/registrations:
    get:
      operationId: listZero3Registrations
      tags: [zero3]
      summary: List event registrations
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Registered teams and athletes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zero3Registration"
        "401":
          description: Authentication required
    post:
      operationId: createZero3Registration
      tags: [zero3]
      summary: Register a team or athlete
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zero3RegistrationInput"
      responses:
        "201":
          description: Created registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3Registration"
        "400":
          description: Invalid or duplicate registration
        "401":
          description: Authentication required
  /zero3/events/{eventId}/roster-management:
    get:
      operationId: getZero3RosterManagement
      tags: [zero3]
      summary: List event teams and registration statuses for administrators
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Event teams with payment, confirmation, and history counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Zero3RosterManagementEntry" }
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
    put:
      operationId: updateZero3RosterManagement
      tags: [zero3]
      summary: Atomically update one or two event teams
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zero3RosterManagementUpdateInput" }
      responses:
        "200":
          description: Updated teams and audit entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3RosterManagementUpdateResponse" }
        "400":
          description: Invalid team composition or status
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
        "409":
          description: Duplicate athlete or explicit result-history decision required
  /zero3/events/{eventId}/roster-import/preview:
    post:
      operationId: previewZero3RosterImport
      tags: [zero3]
      summary: Simulate the approved roster import without writing data
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zero3RosterImportPreviewInput" }
      responses:
        "200":
          description: Source data, exact database candidates, and planned changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3RosterImportPreviewResponse" }
        "400":
          description: Invalid category mapping or unresolved source references
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
  /zero3/events/{eventId}/roster-import/apply:
    post:
      operationId: applyZero3RosterImport
      tags: [zero3]
      summary: Apply a reviewed roster import atomically
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zero3RosterImportApplyInput" }
      responses:
        "200":
          description: Import applied or safely recognized as already applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3RosterImportApplyResponse" }
        "400":
          description: Invalid import plan
        "401":
          description: Authentication required
        "403":
          description: Administrator role or non-production import gate required
        "409":
          description: Plan changed, identity conflict, or source content changed
  /zero3/events/{eventId}/registrations/{registrationId}:
    patch:
      operationId: updateZero3Registration
      tags: [zero3]
      summary: Add or edit a team name without changing its registration
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: path
          name: registrationId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zero3RegistrationUpdate"
      responses:
        "200":
          description: Updated registration; athlete and result links remain unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3Registration"
        "401":
          description: Authentication required
        "404":
          description: Registration not found
    delete:
      operationId: deleteZero3Registration
      tags: [zero3]
      summary: Delete an event registration when it has no protected history
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: path
          name: registrationId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Registration deleted without deleting athletes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3RegistrationDeleteResult" }
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
        "404":
          description: Registration not found
        "409":
          description: Registration has history and must be cancelled instead
  /zero3/events/{eventId}/registrations/{registrationId}/cancel:
    post:
      operationId: cancelZero3Registration
      tags: [zero3]
      summary: Cancel an event registration while preserving history
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: path
          name: registrationId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zero3RegistrationCancelInput" }
      responses:
        "200":
          description: Registration cancelled and retained for history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3RegistrationCancelResult" }
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
        "404":
          description: Registration not found
        "409":
          description: Registration is already cancelled or referenced by a published podium
  /zero3/athletes:
    get:
      operationId: listZero3Athletes
      tags: [zero3]
      summary: List persistent athlete records
      responses:
        "200":
          description: Athletes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zero3Athlete"
        "401":
          description: Authentication required
    post:
      operationId: createZero3Athlete
      tags: [zero3]
      summary: Create an athlete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zero3AthleteInput"
      responses:
        "201":
          description: Created athlete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3Athlete"
        "401":
          description: Authentication required
  /zero3/athletes/{athleteId}:
    put:
      operationId: updateZero3Athlete
      tags: [zero3]
      summary: Update an athlete's name
      parameters:
        - in: path
          name: athleteId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zero3AthleteInput" }
      responses:
        "200":
          description: Updated athlete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3Athlete" }
        "401":
          description: Authentication required
        "404":
          description: Athlete not found
    delete:
      operationId: deleteZero3Athlete
      tags: [zero3]
      summary: Delete an athlete with no event or import links
      parameters:
        - in: path
          name: athleteId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted athlete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3AthleteDeleteResult" }
        "401":
          description: Authentication required
        "409":
          description: Athlete is linked to event data
  /zero3/events/{eventId}/timer:
    put:
      operationId: controlZero3Timer
      tags: [zero3]
      summary: Apply a shared sports timer command
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zero3TimerCommand"
      responses:
        "200":
          description: Updated shared timer state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3Timer"
        "401":
          description: Authentication required
        "409":
          description: Timer state changed in another client
  /zero3/results:
    post:
      operationId: captureZero3Result
      tags: [zero3]
      summary: Record a finish result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zero3ResultInput"
      responses:
        "201":
          description: Recorded provisional result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3Result"
        "400":
          description: Invalid or duplicate finish
        "401":
          description: Authentication required
  /zero3/events/{eventId}/ranking-publication:
    get:
      operationId: getZero3RankingPublication
      tags: [zero3]
      summary: Preview reviewed results and the current event ranking publication
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Publication preview and current revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3RankingPublicationPreview" }
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
        "404":
          description: Event not found
    post:
      operationId: publishZero3Ranking
      tags: [zero3]
      summary: Publish the reviewed results for one event as an atomic ranking revision
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zero3RankingPublicationInput" }
      responses:
        "200":
          description: Published ranking revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zero3RankingPublicationResult" }
        "400":
          description: No reviewed results or a blocking scoring rule
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
        "404":
          description: Event not found
        "409":
          description: Results changed after the preview
  /zero3/results/{resultId}:
    patch:
      operationId: updateZero3Result
      tags: [zero3]
      summary: Validate or correct a result
      parameters:
        - in: path
          name: resultId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zero3ResultUpdate"
      responses:
        "200":
          description: Updated result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3Result"
        "401":
          description: Authentication required
        "404":
          description: Result not found
  /zero3/events/{eventId}/podiums/{category}:
    get:
      operationId: getZero3PodiumState
      tags: [zero3]
      summary: Get private podium draft and public version
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
        - in: path
          name: category
          required: true
          schema:
            $ref: "#/components/schemas/Zero3Category"
      responses:
        "200":
          description: Draft is private; published version is separately identified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3PodiumState"
        "401":
          description: Authentication required
    put:
      operationId: saveZero3PodiumDraft
      tags: [zero3]
      summary: Save a private manual podium draft
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
        - in: path
          name: category
          required: true
          schema:
            $ref: "#/components/schemas/Zero3Category"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zero3PodiumInput"
      responses:
        "200":
          description: Saved podium draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3Podium"
        "401":
          description: Authentication required
  /zero3/events/{eventId}/podiums/{category}/publish:
    post:
      operationId: publishZero3Podium
      tags: [zero3]
      summary: Publish a manual podium to the public TV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zero3PodiumPublishInput"
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
        - in: path
          name: category
          required: true
          schema:
            $ref: "#/components/schemas/Zero3Category"
      responses:
        "200":
          description: Published podium
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3Podium"
        "401":
          description: Authentication required
        "400":
          description: Podium does not reference valid registrations
  /zero3/members:
    get:
      operationId: listZero3Members
      tags: [zero3]
      summary: List authorized operation members
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zero3Member"
        "401":
          description: Authentication required
    put:
      operationId: setZero3MemberRole
      tags: [zero3]
      summary: Grant an operation role to a verified email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Zero3MemberInput"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3Member"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /zero3/public-board:
    get:
      operationId: getZero3PublicBoard
      tags: [zero3]
      summary: Get the unified public competition TV board
      parameters:
        - in: query
          name: eventId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Public SC/RX results and podiums with timer state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zero3PublicBoard"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Zero3Category:
      type: string
      minLength: 1
      maxLength: 32
    Zero3Role:
      type: string
      enum: [ADMIN, JUIZ_CHEFE, JUIZ]
    Zero3EventStatus:
      type: string
      enum: [PLANNED, ACTIVE, FINISHED]
    Zero3ResultStatus:
      type: string
      enum: [PROVISIONAL, VALIDATED, DNS, DNF]
    Zero3TimerState:
      type: string
      enum: [IDLE, PREPARATION, RUNNING, PAUSED, FINISHED, CANCELLED]
    Zero3Me:
      type: object
      properties:
        userId: { type: string }
        email: { type: ["string", "null"] }
        role: { $ref: "#/components/schemas/Zero3Role" }
      required: [userId, role]
    Zero3Dashboard:
      type: object
      properties:
        eventCount: { type: integer }
        athleteCount: { type: integer }
        activeEvent: { $ref: "#/components/schemas/Zero3Event" }
        recentResults:
          type: array
          items: { $ref: "#/components/schemas/Zero3Result" }
        connected: { type: boolean }
      required: [eventCount, athleteCount, recentResults, connected]
    Zero3Event:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        proofName: { type: string }
        status: { $ref: "#/components/schemas/Zero3EventStatus" }
        preparationSeconds: { type: integer }
        categories:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { $ref: "#/components/schemas/Zero3Category" }
        createdAt: { type: string, format: date-time }
      required: [id, name, proofName, status, preparationSeconds, categories, createdAt]
    Zero3EventInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        proofName: { type: string, minLength: 1 }
        preparationSeconds: { type: integer, minimum: 0, maximum: 120 }
        categories:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { $ref: "#/components/schemas/Zero3Category" }
      required: [name, preparationSeconds]
    Zero3EventUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        proofName: { type: string, minLength: 1 }
        status: { $ref: "#/components/schemas/Zero3EventStatus" }
        preparationSeconds: { type: integer, minimum: 0, maximum: 120 }
        categories:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { $ref: "#/components/schemas/Zero3Category" }
      minProperties: 1
    Zero3EventBackup:
      type: object
      required: [format, version, eventId, eventName, exportedAt, counts, data, digest]
      properties:
        format: { type: string, const: zero3-event-backup }
        version: { type: integer, enum: [1, 2, 3, 4, 5, 6] }
        eventId: { type: string }
        eventName: { type: string }
        exportedAt: { type: string, format: date-time }
        counts:
          type: object
          additionalProperties: { type: integer }
        data:
          type: object
          required: [event, athletes, proofs, registrations, registrationMembers, registrationAudit, importBatches, importPeople, importTeams, heats, heatEntries, activeHeats, results, resultRevisions, timers, podiumVersions]
          properties:
            event: { type: object, additionalProperties: true }
            athletes: { type: array, items: { type: object, additionalProperties: true } }
            proofs: { type: array, items: { type: object, additionalProperties: true } }
            registrations: { type: array, items: { type: object, additionalProperties: true } }
            registrationMembers: { type: array, items: { type: object, additionalProperties: true } }
            registrationAudit: { type: array, items: { type: object, additionalProperties: true } }
            importBatches: { type: array, items: { type: object, additionalProperties: true } }
            importPeople: { type: array, items: { type: object, additionalProperties: true } }
            importTeams: { type: array, items: { type: object, additionalProperties: true } }
            heats: { type: array, items: { type: object, additionalProperties: true } }
            heatEntries: { type: array, items: { type: object, additionalProperties: true } }
            activeHeats: { type: array, items: { type: object, additionalProperties: true } }
            results: { type: array, items: { type: object, additionalProperties: true } }
            rankingPublications: { type: array, items: { type: object, additionalProperties: true } }
            resultRevisions: { type: array, items: { type: object, additionalProperties: true } }
            timers: { type: array, items: { type: object, additionalProperties: true } }
            podiumVersions: { type: array, items: { type: object, additionalProperties: true } }
            heatRuns: { type: array, items: { type: object, additionalProperties: true } }
            heatPublications: { type: array, items: { type: object, additionalProperties: true } }
            batteries: { type: array, items: { type: object, additionalProperties: true } }
            batteryEntries: { type: array, items: { type: object, additionalProperties: true } }
            activeBatteries: { type: array, items: { type: object, additionalProperties: true } }
            batteryRuns: { type: array, items: { type: object, additionalProperties: true } }
            batteryPublications: { type: array, items: { type: object, additionalProperties: true } }
            batteryTimeCapAudit: { type: array, items: { type: object, additionalProperties: true } }
        digest: { type: string, minLength: 64, maxLength: 64 }
    Zero3EventDeleteInput:
      type: object
      required: [confirmation]
      properties:
        confirmation: { type: string, minLength: 1, maxLength: 160 }
        backupDigest:
          type: string
          minLength: 64
          maxLength: 64
          description: Optional compatibility field for older clients; deletion no longer requires a client backup.
    Zero3EventRestoreInput:
      type: object
      required: [backup]
      properties:
        backup: { $ref: "#/components/schemas/Zero3EventBackup" }
    Zero3EventDeleteResult:
      type: object
      required: [eventId, deleted]
      properties:
        eventId: { type: string }
        deleted: { type: boolean }
    Zero3EventBatteryUpdateInput:
      type: object
      properties:
        expectedName: { type: string, minLength: 1, maxLength: 120 }
        expectedOrder: { type: integer, minimum: 1 }
        expectedScheduledStartAt: { type: ["string", "null"], format: date-time }
        expectedRegistrationIds:
          type: array
          uniqueItems: true
          items: { type: string }
        name: { type: string, minLength: 1, maxLength: 120 }
        order: { type: integer, minimum: 1 }
        scheduledStartAt: { type: ["string", "null"], format: date-time }
        swapWithBatteryId: { type: string }
        registrationIds:
          type: array
          uniqueItems: true
          items: { type: string }
      required: [expectedName, expectedOrder, expectedRegistrationIds, name, order, registrationIds]
    Zero3EventBatteryDeleteInput:
      type: object
      properties:
        confirmation: { type: string, minLength: 1, maxLength: 160 }
        expectedFingerprint:
          type: string
          minLength: 64
          maxLength: 64
          pattern: "^[a-f0-9]{64}$"
      required: [confirmation, expectedFingerprint]
    Zero3EventBatteryDeleteResult:
      type: object
      properties:
        eventId: { type: string }
        batteryId: { type: string }
        deleted: { type: boolean }
        removedResults: { type: integer, minimum: 0 }
        removedPublications: { type: integer, minimum: 0 }
        wasActive: { type: boolean }
      required: [eventId, batteryId, deleted, removedResults, removedPublications, wasActive]
    Zero3EventRestoreResult:
      type: object
      required: [eventId, restored]
      properties:
        eventId: { type: string }
        restored: { type: boolean }
    Zero3ProofMetric:
      type: string
      enum: [TIME, REPETITIONS, LOAD, CUSTOM, UNCONFIGURED]
    Zero3ProofDirection:
      type: string
      enum: [LOWER, HIGHER]
    Zero3Proof:
      type: object
      properties:
        id: { type: string }
        eventId: { type: string }
        order: { type: integer, minimum: 1, maximum: 4 }
        name: { type: string }
        metricType: { $ref: "#/components/schemas/Zero3ProofMetric" }
        unit: { type: ["string", "null"] }
        direction: { oneOf: [{ $ref: "#/components/schemas/Zero3ProofDirection" }, { type: "null" }] }
        configured: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, eventId, order, name, metricType, unit, direction, configured, createdAt]
    Zero3ProofUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        metricType: { $ref: "#/components/schemas/Zero3ProofMetric" }
        unit: { type: ["string", "null"] }
        direction: { $ref: "#/components/schemas/Zero3ProofDirection" }
      required: [name, metricType, direction]
    Zero3Athlete:
      type: object
      properties:
        id: { type: string }
        fullName: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, fullName, createdAt]
    Zero3AthleteInput:
      type: object
      properties:
        fullName: { type: string, minLength: 1 }
      required: [fullName]
    Zero3AthleteDeleteResult:
      type: object
      properties:
        id: { type: string }
        deleted: { type: boolean, const: true }
      required: [id, deleted]
    Zero3Registration:
      type: object
      properties:
        id: { type: string }
        eventId: { type: string }
        category: { $ref: "#/components/schemas/Zero3Category" }
        teamName: { type: ["string", "null"] }
        athleteIds:
          type: array
          items: { type: string }
        athleteNames:
          type: array
          items: { type: string }
        laneLabel: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, eventId, category, athleteIds, athleteNames, createdAt]
    Zero3RegistrationInput:
      type: object
      properties:
        category: { $ref: "#/components/schemas/Zero3Category" }
        teamName:
          type: ["string", "null"]
          maxLength: 40
          pattern: '^[^<>\u0000-\u001F\u007F-\u009F]*$'
        athleteIds:
          type: array
          items: { type: string }
          minItems: 2
          maxItems: 2
        laneLabel: { type: ["string", "null"] }
      required: [category, athleteIds]
    Zero3RegistrationUpdate:
      type: object
      properties:
        teamName:
          type: ["string", "null"]
          maxLength: 40
          pattern: '^[^<>\u0000-\u001F\u007F-\u009F]*$'
      required: [teamName]
    Zero3RegistrationConfirmationStatus:
      type: string
      enum: [INTERESTED, PENDING, CONFIRMED, CANCELLED]
    Zero3RegistrationPaymentStatus:
      type: string
      enum: [UNVERIFIED, PENDING, PAID, NOT_PAID]
    Zero3RosterManagementAuditEntry:
      type: object
      properties:
        id: { type: string }
        actorId: { type: string }
        reason: { type: string }
        beforeState: { type: object, additionalProperties: true }
        afterState: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
      required: [id, actorId, reason, beforeState, afterState, createdAt]
    Zero3RosterManagementEntry:
      type: object
      properties:
        id: { type: string }
        eventId: { type: string }
        category: { $ref: "#/components/schemas/Zero3Category" }
        teamName: { type: ["string", "null"] }
        athleteIds: { type: array, minItems: 1, items: { type: string } }
        athleteNames: { type: array, items: { type: string } }
        confirmationStatus: { $ref: "#/components/schemas/Zero3RegistrationConfirmationStatus" }
        paymentStatus: { $ref: "#/components/schemas/Zero3RegistrationPaymentStatus" }
        resultCount: { type: integer, minimum: 0 }
        heatEntryCount: { type: integer, minimum: 0 }
        podiumCount: { type: integer, minimum: 0 }
        sourceCodes: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        audit:
          type: array
          items: { $ref: "#/components/schemas/Zero3RosterManagementAuditEntry" }
      required: [id, eventId, category, athleteIds, athleteNames, confirmationStatus, paymentStatus, resultCount, heatEntryCount, podiumCount, sourceCodes, createdAt, audit]
    Zero3RosterManagementEdit:
      type: object
      properties:
        registrationId: { type: string }
        teamName:
          type: ["string", "null"]
          maxLength: 40
          pattern: '^[^<>\u0000-\u001F\u007F-\u009F]*$'
        category: { $ref: "#/components/schemas/Zero3Category" }
        athleteIds:
          type: array
          minItems: 1
          maxItems: 2
          items: { type: string }
        confirmationStatus: { $ref: "#/components/schemas/Zero3RegistrationConfirmationStatus" }
        paymentStatus: { $ref: "#/components/schemas/Zero3RegistrationPaymentStatus" }
        reason:
          type: string
          description: Deprecated optional client field; audit reasons are generated by the server.
      required: [registrationId, category, athleteIds, confirmationStatus, paymentStatus]
    Zero3RosterManagementUpdateInput:
      type: object
      properties:
        edits:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: "#/components/schemas/Zero3RosterManagementEdit" }
      required: [edits]
    Zero3RosterManagementUpdateResponse:
      type: object
      properties:
        registrations:
          type: array
          items: { $ref: "#/components/schemas/Zero3RosterManagementEntry" }
      required: [registrations]
    Zero3RegistrationDeleteResult:
      type: object
      properties:
        registrationId: { type: string }
        deleted: { type: boolean, const: true }
      required: [registrationId, deleted]
    Zero3RegistrationCancelInput:
      type: object
      properties:
        reason: { type: string, minLength: 3 }
      required: [reason]
    Zero3RegistrationCancelResult:
      type: object
      properties:
        registrationId: { type: string }
        cancelled: { type: boolean, const: true }
      required: [registrationId, cancelled]
    Zero3RosterImportResolution:
      type: object
      properties:
        sourceKey: { type: string }
        action: { type: string, enum: [CREATE, REUSE] }
        athleteId: { type: ["string", "null"] }
      required: [sourceKey, action, athleteId]
    Zero3RosterImportPreviewInput:
      type: object
      properties:
        scaleTargetCategory:
          type: string
          enum: [SC]
        resolutions:
          type: array
          items: { $ref: "#/components/schemas/Zero3RosterImportResolution" }
      required: [scaleTargetCategory, resolutions]
    Zero3RosterImportPerson:
      type: object
      properties:
        sourceKey: { type: string }
        sourceCode: { type: string }
        sourceCell: { type: string }
        fullName: { type: string }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/Zero3Athlete" }
        resolutionAction: { type: ["string", "null"], enum: [CREATE, REUSE, null] }
        resolvedAthleteId: { type: ["string", "null"] }
      required: [sourceKey, sourceCode, sourceCell, fullName, candidates, resolutionAction, resolvedAthleteId]
    Zero3RosterImportTeam:
      type: object
      properties:
        sourceCode: { type: string }
        sourceCategory: { type: string, enum: [RX, SCALE] }
        sourceRow: { type: integer }
        sourceCells:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string }
        athleteNames:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string }
        targetCategory: { $ref: "#/components/schemas/Zero3Category" }
        existingRegistrationId: { type: ["string", "null"] }
        conflict: { type: ["string", "null"] }
        confirmationStatus: { $ref: "#/components/schemas/Zero3RegistrationConfirmationStatus" }
        paymentStatus: { $ref: "#/components/schemas/Zero3RegistrationPaymentStatus" }
      required: [sourceCode, sourceCategory, sourceRow, sourceCells, athleteNames, targetCategory, existingRegistrationId, conflict, confirmationStatus, paymentStatus]
    Zero3RosterImportPreviewResponse:
      type: object
      properties:
        event: { $ref: "#/components/schemas/Zero3Event" }
        datasetKey: { type: string }
        sourceFile: { type: string }
        sourceSheet: { type: string }
        contentHash: { type: string }
        environment: { type: string }
        alreadyApplied: { type: boolean }
        isDemoTarget: { type: boolean }
        people: { type: array, items: { $ref: "#/components/schemas/Zero3RosterImportPerson" } }
        teams: { type: array, items: { $ref: "#/components/schemas/Zero3RosterImportTeam" } }
        counts:
          type: object
          properties:
            sourcePeople: { type: integer }
            sourceTeams: { type: integer }
            peopleToCreate: { type: integer }
            peopleToReuse: { type: integer }
            unresolvedPeople: { type: integer }
            teamsToCreate: { type: integer }
            teamsToReuse: { type: integer }
            conflicts: { type: integer }
          required: [sourcePeople, sourceTeams, peopleToCreate, peopleToReuse, unresolvedPeople, teamsToCreate, teamsToReuse, conflicts]
        excludedSourceNotes:
          type: array
          items:
            type: object
            properties:
              cells: { type: array, items: { type: string } }
              text: { type: string }
            required: [cells, text]
      required: [event, datasetKey, sourceFile, sourceSheet, contentHash, environment, alreadyApplied, isDemoTarget, people, teams, counts, excludedSourceNotes]
    Zero3RosterImportApplyInput:
      type: object
      properties:
        scaleTargetCategory:
          type: string
          enum: [SC]
        resolutions:
          type: array
          items: { $ref: "#/components/schemas/Zero3RosterImportResolution" }
        contentHash: { type: string }
        confirmDemoEvent: { type: boolean }
      required: [scaleTargetCategory, resolutions, contentHash, confirmDemoEvent]
    Zero3RosterImportApplyResponse:
      type: object
      properties:
        batchId: { type: string }
        alreadyApplied: { type: boolean }
        createdPeople: { type: integer }
        reusedPeople: { type: integer }
        createdTeams: { type: integer }
        reusedTeams: { type: integer }
        registrationIds: { type: array, items: { type: string } }
      required: [batchId, alreadyApplied, createdPeople, reusedPeople, createdTeams, reusedTeams, registrationIds]
    Zero3Heat:
      type: object
      properties:
        id: { type: string }
        eventId: { type: string }
        category: { $ref: "#/components/schemas/Zero3Category" }
